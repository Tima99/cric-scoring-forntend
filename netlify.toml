# Netlify build + routing config for the Vite/React single-page app

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: serve index.html for every path so React Router handles
# /matches, /team/:id, /scoring ... on refresh and when a link is opened directly.
# (status 200 = rewrite, the URL in the browser does not change)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
